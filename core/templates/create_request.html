{% extends 'base.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow-lg border-0 p-4" style="width: 400px; border-radius: 15px;">

        <div class="text-center mb-3">
            <h3 class="text-danger">🚨 Create Blood Request</h3>
            <p class="text-muted">Request blood from nearby donors</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <!--  Blood Group -->
            <label class="form-label fw-semibold">Blood Group</label>
            <select name="blood_group" class="form-control mb-3" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <!--  Location -->
            <label class="form-label fw-semibold">Location</label>
            <input type="text" name="location" class="form-control mb-3"
                   placeholder="Enter hospital location" required>

            <!-- SUBMIT -->
            <button class="btn btn-danger w-100 mt-2">
                Send Request 
            </button>

        </form>

    </div>

</div>

{% endblock %}
